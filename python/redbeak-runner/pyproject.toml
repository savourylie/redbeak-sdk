[project]
name = "redbeak-runner"
version = "0.1.0"
description = "Generic outbound Redbeak runner: leases, idempotent evidence, and resume"
requires-python = ">=3.11"
dependencies = [
    "redbeak-contracts",
    "redbeak-adapter-sdk",
    "httpx>=0.27",
    "starlette>=0.41",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
redbeak = "redbeak_runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redbeak_runner"]
