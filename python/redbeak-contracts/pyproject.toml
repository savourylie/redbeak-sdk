[project]
name = "redbeak-contracts"
version = "0.1.0"
description = "Loader and validator for the versioned Redbeak wire contract"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redbeak_contracts"]
