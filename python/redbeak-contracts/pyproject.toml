[project]
name = "redbeak-contracts"
version = "0.1.0"
description = "Loader and validator for the versioned Redbeak wire contract"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redbeak_contracts"]

[tool.hatch.build]
exclude = ["src/redbeak_contracts/_editable_contracts_root.txt", "src/redbeak_contracts/_contracts"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "hatch_build.py", "pyproject.toml", "README.md"]
