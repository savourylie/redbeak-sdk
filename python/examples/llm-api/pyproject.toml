[project]
name = "redbeak-example-llm-api"
version = "0.1.0"
description = "Minimal single-turn Redbeak target adapter for an OpenAI-compatible LLM API"
requires-python = ">=3.11"
# The model-provider call is plain HTTP against httpx, which redbeak-runner
# already installs. A vendor SDK would add a dependency tree to the one file in
# this repository a customer is invited to copy.
dependencies = [
    "redbeak-adapter-sdk",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redbeak_example_llm_api"]
