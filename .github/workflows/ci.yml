name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Everything in this repository must stay runnable by anyone who can clone it.
# This workflow uses no secrets, starts no services, binds no port, and reaches
# no model provider. If a step here ever needs a credential, the contract has
# grown a dependency it should not have.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          # Verify offline checks using only artifacts installed during this job.
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/redbeak-ci-cache
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Offline checks and distribution acceptance
        run: make check

      # Version tags are created as a separately authorized release action.
      # Once present, every build must continue to match the public contract tag.
      - name: Verify the released contract
        shell: bash
        run: |
          if git rev-parse --verify refs/tags/contract-v0.1 >/dev/null 2>&1; then
            make contract-release-check
          else
            echo "contract-v0.1 is not yet tagged; release verification remains pending."
          fi
