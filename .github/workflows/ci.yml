name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Everything in this repository must stay runnable by anyone who can clone it.
# This workflow uses no secrets, starts no services, binds no port, and reaches
# no model provider. If a step here ever needs a credential, the contract has
# grown a dependency it should not have.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      # Includes the runner protocol tests -- leases, idempotency,
      # authorization, resume, pending submission, and the walking skeleton --
      # which drive the in-memory reference server through httpx.ASGITransport.
      # They are the checks that demonstrate the guarantees an auditor came for.
      - name: Test
        run: uv run pytest
